name: Demo-Action-Multi-jobs
on: push

jobs:
    ascill_job:
        runs-on: ubuntu-latest
        steps:
            - name: checkout Repo
              uses: actions/checkout@v7

            - name: Execute Shell script
              run: |
               chmod +x script.sh
               ./script.sh

            - name: upload the dragon file
              uses: actions/upload-artifact@v7
              with:
                name: dragon.txt
                path: dragon.txt
            
    
    test_job:
        needs: ascill_job
        runs-on: ubuntu-latest
        steps:
            - name: dowload dragon file
              uses: actions/download-artifact@v8
              with:
                name: dragon.txt 
              
            - name: Test file exits
              run: grep -i "dragon" dragon.txt

    deploy_job:
        needs: test_job
        runs-on: ubuntu-latest
        steps:
            - name: dowload dragon file
              uses: actions/download-artifact@v8
              with:
                name: dragon.txt 
                
            - name: Read the file
              run: cat dragon.txt
            
            - name: deploy
              run: echo " deploy......."