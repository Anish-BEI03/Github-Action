name: Concurration test
on:
  workflow_dispatch:
  #push

env:
  CONTAINER_REGISTRY: docker.io
  IMAGE_NAME: github-actions-nginx
  TAG: latest

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: docker build
        run: echo "docker build -t ${{ env.CONTAINER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}"

      - name: docker login
        env:
          DOCKER_PASSWORD: black212369
        run: echo "docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASS }}"

      - name: docker push
        run: echo "docker push ${{ env.CONTAINER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}"

  deployment:
    needs: docker
    concurrency:
      group: production-deployment
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: docker run
        timeout-minutes: 1
        run: |
          echo "docker run -d -p 8080:80 ${{ env.CONTAINER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}"
          sleep 600s
